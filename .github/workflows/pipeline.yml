name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths-ignore:
      - 'assets/**'
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'assets/**'
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stage 1: Code Quality & Unit Tests
  test-and-lint:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.5

      - name: Run Unit Tests with Coverage & Race Detector
        run: |
          go test -race -v -coverprofile=coverage.out $(go list ./... | grep -v /cmd)

      - name: Verify Code Coverage Threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total Code Coverage: ${COVERAGE}%"
          if (( $(echo "$COVERAGE < 80.0" | bc -l) )); then
            echo "Error: Code coverage ($COVERAGE%) is below required threshold (80%)!"
            exit 1
          fi

  # Stage 2: Static Application Security Testing (SAST)
  sast-scan:
    name: Security Audit (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Official Go Vulnerability Checker (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec.sarif ./...'

  # Stage 3: Container Vulnerability Scan
  container-security:
    name: Container Security (Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Local Docker Image
        run: |
          docker build -t arcana-gate:test .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'arcana-gate:test'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # Stage 4: CD / Automated Release
  release:
    name: Create GitHub Release
    needs: [test-and-lint, sast-scan, container-security]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
  # Stage 5: Telegram notification
  telegram-notification:
    name: 📱 Telegram Alert
    runs-on: ubuntu-latest
    needs: [test-and-lint, sast-scan, container-security, release]
    if: always()
    steps:
      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            🛡️ *DevSecOps Pipeline Status*
            
            🔹 *Repository:* `${{ github.repository }}`
            🔹 *Branch/Tag:* `${{ github.ref_name }}`
            🔹 *Commit:* `${{ github.sha }}`
            
            📊 *Pipeline Status:* ${{ (needs.test-and-lint.result == 'success' && needs.sast-scan.result == 'success' && needs.container-security.result == 'success' && needs.release.result != 'failure') && '✅ SUCCESS' || '❌ FAILED' }}
            🚀 *Release / Deploy:* ${{ needs.release.result == 'success' && '✅ Published' || (needs.release.result == 'skipped' && '⏩ Skipped (No Tag)' || '❌ Failed') }}
            
            🔗 [View Workflow Run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})